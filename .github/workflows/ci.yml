name: Immich Frames CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feature/**]

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: pytest -q
      - run: python scripts/product_contract.py --check
      - run: python scripts/check_release.py
      - run: python scripts/check_installation.py wheel
      - run: python -m compileall -q custom_components
      - run: python -c "import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path('custom_components/immich_frames').glob('*.json')]"

  native-integration:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install '.[test]' -r requirements-native-test.txt
      - run: ruff check --select F821,F822,F823 custom_components src
      - run: pytest -q tests_native
      - run: python scripts/check_installation.py hacs

  hassfest:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/hassfest.sh

  container:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    needs: [tests, native-integration, hassfest]
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: mkdir -p "${{ runner.temp }}/candidate-${{ matrix.name }}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: immich_frames/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            SOURCE_COMMIT=${{ github.sha }}
          push: false
          tags: immich-frames:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          outputs: type=docker,dest=${{ runner.temp }}/candidate-${{ matrix.name }}/image.tar
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Test and record the exact image archive
        env:
          CANDIDATE: ${{ runner.temp }}/candidate-${{ matrix.name }}/image.tar
          CANDIDATE_IMAGE: immich-frames:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        run: python scripts/container_artifact.py record --archive "$CANDIDATE" --image "$CANDIDATE_IMAGE" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: container-${{ matrix.name }}
          path: ${{ runner.temp }}/candidate-${{ matrix.name }}/
          retention-days: 7
          if-no-files-found: error
