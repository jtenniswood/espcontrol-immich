name: Immich Frames CI

on:
  pull_request:
  push:
    branches: [main, feature/**]

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q custom_components
      - run: python -c "import json, pathlib; [json.loads(path.read_text()) for path in pathlib.Path('custom_components/immich_frames').glob('*.json')]"

  native-integration:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]' -r requirements-native-test.txt
      - run: ruff check --select F821,F822,F823 custom_components src
      - run: pytest -q tests_native

  container:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    needs: [tests, native-integration]
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: immich_frames/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: false
          tags: immich-frames:test-${{ matrix.name }}
