name: Immich Frames CI

on:
  pull_request:
  push:
    branches: [main, feature/**]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: immich_frames/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: false
          tags: immich-frames:test-${{ matrix.name }}

