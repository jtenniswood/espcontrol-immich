name: Publish Immich Frames

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching the native integration manifest (for example v0.2.14)
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: immich-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  hacs:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release-contract:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_release.py
      - name: Check manual release target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const repo = context.repo;
            try {
              let {data: ref} = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              let object = ref.object;
              while (object.type === 'tag') {
                const {data} = await github.rest.git.getTag({...repo, tag_sha: object.sha});
                object = data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error('Existing tag does not identify this checked commit');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              throw new Error('A release already exists for this tag; choose a new version');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  publish:
    needs: [validation, hacs, release-contract]
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: container-${{ matrix.name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the tested archive and source commit
        env:
          CANDIDATE_IMAGE: immich-frames:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
        run: python scripts/container_artifact.py verify --archive "$RUNNER_TEMP/candidate/image.tar" --image "$CANDIDATE_IMAGE" --commit "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        env:
          ARCH: ${{ matrix.name }}
        run: |
          CANDIDATE_ID=$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/candidate/image.json"))["image_id"])')
          docker tag "$CANDIDATE_ID" "${IMAGE}:${RELEASE_TAG}-${ARCH}"
          docker push "${IMAGE}:${RELEASE_TAG}-${ARCH}"
          docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}-${ARCH}" --raw > "$RUNNER_TEMP/candidate/registry.json"
          python scripts/check_published_image.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/candidate/image.json
            ${{ runner.temp }}/candidate/registry.json
            ${{ runner.temp }}/candidate/digest.txt
          if-no-files-found: error

  manifest:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    needs: publish
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: published-*
          path: ${{ runner.temp }}/published
      - name: Create multi-architecture manifest from verified digests
        run: |
          AMD_DIGEST=$(cat "$RUNNER_TEMP/published/published-amd64/digest.txt")
          ARM_DIGEST=$(cat "$RUNNER_TEMP/published/published-arm64/digest.txt")
          docker buildx imagetools create --tag "${IMAGE}:${RELEASE_TAG}" "${IMAGE}@${AMD_DIGEST}" "${IMAGE}@${ARM_DIGEST}"

  github-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [manifest]
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: published-*
          path: ${{ runner.temp }}/published
      - name: Publish the checked commit after both container images are available
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              generate_release_notes: true,
              draft: true,
            });
            const fs = require('fs');
            const path = require('path');
            for (const arch of ['amd64', 'arm64']) {
              const file = path.join(process.env.RUNNER_TEMP, 'published', `published-${arch}`, 'image.json');
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: data.id, name: `container-${arch}-provenance.json`,
                data: fs.readFileSync(file),
              });
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: data.id, draft: false});
            core.notice(`Published ${data.html_url}`);
