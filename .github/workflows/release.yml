name: Publish Immich Frames

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: immich_frames/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}-${{ matrix.name }}

  manifest:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ github.event.release.tag_name }}" \
            "${IMAGE}:${{ github.event.release.tag_name }}-amd64" \
            "${IMAGE}:${{ github.event.release.tag_name }}-arm64"
