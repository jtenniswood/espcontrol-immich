name: Publish Immich Frames

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching the native integration manifest (for example v0.2.14)
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: immich-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  hacs:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release-contract:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_release.py
      - name: Check manual release target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const repo = context.repo;
            try {
              let {data: ref} = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
              let object = ref.object;
              while (object.type === 'tag') {
                const {data} = await github.rest.git.getTag({...repo, tag_sha: object.sha});
                object = data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error('Existing tag does not identify this checked commit');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              throw new Error('A release already exists for this tag; choose a new version');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  publish:
    needs: [validation, hacs, release-contract]
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:latest
          - name: arm64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: immich_frames/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.name }}

  manifest:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    needs: publish
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            "${IMAGE}:${RELEASE_TAG}-amd64" \
            "${IMAGE}:${RELEASE_TAG}-arm64"

  github-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [manifest]
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    permissions:
      contents: write
    steps:
      - name: Publish the checked commit after both container images are available
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              generate_release_notes: true,
            });
            core.notice(`Published ${data.html_url}`);
