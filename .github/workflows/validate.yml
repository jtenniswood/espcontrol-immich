name: HACS validation

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - name: Validate HACS publishing requirements
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    name: Hassfest
    runs-on: [self-hosted, Linux, X64, espcontrol-immich]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        run: bash scripts/hassfest.sh
