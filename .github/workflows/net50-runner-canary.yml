name: NET-50 runner credential canary

on:
  push:
    branches:
      - ops/net50-runner-canary-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-canary:
    runs-on: [self-hosted, Linux, X64, espcontrol-immich, runner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository runner and credential isolation
        shell: bash
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "github-runner-espcontrol-immich"
          test -z "${ACCESS_TOKEN:-}"
          marker="${GITHUB_WORKSPACE}/.net50-canary-${GITHUB_RUN_ID}"
          printf '%s\n' "${GITHUB_RUN_ID}" > "$marker"
          test -s "$marker"
          rm -f "$marker"
          printf 'canary_runner=%s checkout=ok workspace_write=ok bootstrap_token_absent=ok\n' "$ACTUAL_RUNNER_NAME"
