name: Immich Frames
version: "0.1.0"
slug: immich_frames
description: Create Home Assistant photo-frame devices backed by Immich 3.2+
url: https://github.com/jtenniswood/espcontrol-immich
arch:
  - amd64
  - aarch64
startup: services
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
homeassistant_api: true
map:
  - addon_config:rw
options:
  immich_url: ""
  immich_api_key: ""
  cache_limit_mb: 256
schema:
  # Empty values allow the ingress connection form to be used after install.
  immich_url: str
  immich_api_key: password
  cache_limit_mb: int
