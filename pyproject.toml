[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-frames"
version = "0.1.1"
description = "Home Assistant app for Immich photo frames"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9,<4",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["immich_frames", "custom_components.immich_frames", "custom_components.immich_frames.core"]
package-dir = {"immich_frames" = "src/immich_frames", "custom_components.immich_frames" = "custom_components/immich_frames"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests", "tests_core"]

[tool.setuptools.package-data]
immich_frames = ["web/*.html"]
